<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピシン同期の進捗</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232a78d6%27/%3E%3Crect x=%277%27 y=%2716%27 width=%274%27 height=%279%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%2714%27 y=%2711%27 width=%274%27 height=%2714%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%2721%27 y=%277%27 width=%274%27 height=%2718%27 rx=%271.5%27 fill=%27white%27/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --surface-1:#fcfcfb;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#78776f;
  --line:#e3e2dd; --grid:#eceae5;
  --series-1:#2a78d6; --series-1-soft:#cde2fb;
  --danger:#e34948;
  --radius:10px;
  --sans:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#111110; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e85;
    --line:#2e2e2b; --grid:#272724;
    --series-1:#3987e5; --series-1-soft:#184f95;
    --danger:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface-1:#1a1a19;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e85;
  --line:#2e2e2b; --grid:#272724;
  --series-1:#3987e5; --series-1-soft:#184f95;
  --danger:#e66767;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text-primary);
  font-size:14px;line-height:1.6;padding:28px 20px 64px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;}
header{margin-bottom:22px;}
h1{font-size:19px;font-weight:600;}
header p{color:var(--text-secondary);font-size:12.5px;margin-top:4px;}
.backlink{font-size:11.5px;color:var(--text-muted);text-decoration:none;border-bottom:1px solid var(--line);}
.backlink:hover{color:var(--text-secondary);}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}

.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field > label{font-size:11.5px;color:var(--text-secondary);}
select, input[type="number"]{
  font-family:inherit;font-size:13px;color:var(--text-primary);background:var(--bg);
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-variant-numeric:tabular-nums;
}
input[type="number"]{width:6.5em;}
select:focus-visible, input:focus-visible{outline:2px solid var(--series-1);outline-offset:1px;}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary);padding-bottom:8px;}
button{
  font-family:inherit;font-size:12.5px;color:var(--text-primary);background:var(--surface-1);
  border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:border-color .15s;
}
button:hover:not(:disabled){border-color:var(--text-muted);}
button:focus-visible{outline:2px solid var(--series-1);outline-offset:1px;}
button.primary{background:var(--series-1);border-color:var(--series-1);color:#fff;font-weight:600;}
button:disabled{opacity:.6;cursor:default;}

.spinner{
  width:14px;height:14px;flex:none;border:2px solid var(--series-1-soft);
  border-top-color:var(--series-1);border-radius:50%;animation:spin .7s linear infinite;
}
button.primary .spinner{border-color:rgba(255,255,255,.4);border-top-color:#fff;}
.spinner.big{width:17px;height:17px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .spinner{animation-duration:2.4s;} }

.hero .label{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;}
.hero .value{font-size:60px;font-weight:600;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px;transition:opacity .18s;}
.hero .value.stale{opacity:.32;}
.hero .value.empty{color:var(--text-muted);}
.hero .value .placeholder{font-size:30px;font-weight:400;letter-spacing:.1em;}
.hero .unit{font-size:20px;font-weight:500;color:var(--text-secondary);margin-left:6px;}
.hero .range{font-size:12px;color:var(--text-muted);}
.substats{display:flex;flex-wrap:wrap;gap:26px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.substat .label{font-size:11.5px;color:var(--text-secondary);}
.substat .value{font-size:19px;font-weight:600;margin-top:2px;}
.substat .value small{font-size:12px;font-weight:400;color:var(--text-secondary);margin-left:3px;}

h2{font-size:14px;font-weight:600;}
.sub{font-size:11.5px;color:var(--text-muted);}
.chart{position:relative;margin-top:20px;padding-left:42px;}
.chart .gridlines{position:absolute;inset:0 0 22px 42px;pointer-events:none;}
.chart .gridline{position:absolute;left:0;right:0;border-top:1px solid var(--grid);}
.chart .gridline span{position:absolute;right:calc(100% + 8px);top:-.7em;font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.bars{position:relative;display:flex;align-items:flex-end;gap:2px;height:170px;}
.bar{flex:1 1 0;min-width:3px;position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%;}
.bar i{display:block;width:100%;background:var(--series-1);border-radius:4px 4px 0 0;min-height:2px;transition:height .25s ease;}
.bar:hover i{filter:brightness(1.12);}
.bar .peak{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--text-secondary);font-variant-numeric:tabular-nums;}
.xaxis{display:flex;gap:2px;margin-top:6px;height:16px;}
.xtick{flex:1 1 0;min-width:3px;font-size:10px;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums;}

.tooltip{
  position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--surface-1);border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;font-size:12px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.14);
}
.tooltip.on{opacity:1;}
.tooltip b{font-weight:600;font-variant-numeric:tabular-nums;}

table{border-collapse:collapse;width:100%;margin-top:14px;font-size:12.5px;}
th,td{text-align:left;padding:6px 18px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
th:last-child,td:last-child{padding-right:0;}
th{font-weight:600;color:var(--text-secondary);font-size:11.5px;position:sticky;top:0;background:var(--surface-1);}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--text-primary);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
td.rank{color:var(--text-muted);width:2.5em;}
.tablewrap{max-height:520px;overflow:auto;margin-top:4px;}
.bh{color:var(--text-muted);}
td.muted{color:var(--text-muted);}
td.urgent{color:var(--danger);font-weight:600;}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text-muted);}

.msg{font-size:12.5px;color:var(--text-secondary);margin-top:12px;}
.msg.error{color:var(--danger);}
footer{margin-top:22px;font-size:11.5px;color:var(--text-muted);line-height:1.75;}
footer code{font-size:11px;background:var(--surface-1);border:1px solid var(--line);border-radius:4px;padding:1px 5px;}
[hidden]{display:none !important;}
@media(max-width:560px){ .hero .value{font-size:46px;} .field{flex:1 1 auto;} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>ピシン同期の進捗</h1>
  <p id="subtitle">同じピシン出身者が 42cursus のどこまで進んでいるかを一覧します。</p>
  <p style="margin-top:8px"><a class="backlink" href="/">← レビュー件数カウンター</a></p>
</header>

<section class="card">
  <div class="filters">
    <div class="field">
      <label for="month">ピシンの月</label>
      <select id="month">
        <option value="january">1 月</option>
        <option value="february">2 月</option>
        <option value="march">3 月</option>
        <option value="april">4 月</option>
        <option value="may">5 月</option>
        <option value="june">6 月</option>
        <option value="july">7 月</option>
        <option value="august">8 月</option>
        <option value="september" selected>9 月</option>
        <option value="october">10 月</option>
        <option value="november">11 月</option>
        <option value="december">12 月</option>
      </select>
    </div>
    <div class="field">
      <label for="year">年</label>
      <input type="number" id="year" min="2013" max="2100" step="1" value="2025" inputmode="numeric">
    </div>
    <label class="check"><input type="checkbox" id="include-bh" checked> ブラックホール済みも含める</label>
    <button class="primary" id="load">読み込む</button>
  </div>
  <p class="msg" id="msg" hidden></p>
</section>

<section class="card hero">
  <div class="label">
    <span>42cursus に在籍した人数</span>
    <span class="spinner big" id="spinner" hidden></span>
  </div>
  <div class="value empty" id="count"><span class="placeholder">—</span><span class="unit">人</span></div>
  <div class="range" id="cohort-label">—</div>
  <div class="substats" id="substats" hidden>
    <div class="substat"><div class="label">ピシン参加者</div><div class="value" id="pisciners">—<small>人</small></div></div>
    <div class="substat"><div class="label">レベル中央値</div><div class="value" id="median">—</div></div>
    <div class="substat"><div class="label">最高レベル</div><div class="value" id="top">—</div></div>
    <div class="substat"><div class="label">ブラックホール済み</div><div class="value" id="blackholed">—<small>人</small></div></div>
    <div class="substat"><div class="label">期限 30 日以内</div><div class="value" id="soon">—<small>人</small></div></div>
  </div>
</section>

<section class="card" id="chart-card" hidden>
  <h2>レベルの分布</h2>
  <div class="sub" id="chart-sub">横軸はレベル、縦軸は人数。</div>
  <div class="chart">
    <div class="gridlines" id="gridlines"></div>
    <div class="bars" id="bars"></div>
    <div class="xaxis" id="xaxis"></div>
  </div>
</section>

<section class="card" id="list-card" hidden>
  <h2>一覧</h2>
  <div class="sub" id="list-sub"></div>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th class="sortable" data-sort="login">login</th>
          <th class="sortable num" data-sort="level">レベル</th>
          <th class="sortable" data-sort="beginAt">開始</th>
          <th class="sortable" data-sort="blackholedAt">ブラックホール</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>

<footer id="footer"></footer>
</div>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const els = {
  month: $("month"), year: $("year"), includeBh: $("include-bh"), load: $("load"), msg: $("msg"),
  spinner: $("spinner"), count: $("count"), cohortLabel: $("cohort-label"), substats: $("substats"),
  pisciners: $("pisciners"), median: $("median"), top: $("top"),
  blackholed: $("blackholed"), soon: $("soon"),
  chartCard: $("chart-card"), chartSub: $("chart-sub"),
  gridlines: $("gridlines"), bars: $("bars"), xaxis: $("xaxis"),
  listCard: $("list-card"), listSub: $("list-sub"), tbody: $("tbody"),
  tooltip: $("tooltip"), footer: $("footer"), subtitle: $("subtitle"),
};

const MONTH_JA = {
  january: "1 月", february: "2 月", march: "3 月", april: "4 月", may: "5 月", june: "6 月",
  july: "7 月", august: "8 月", september: "9 月", october: "10 月", november: "11 月", december: "12 月",
};
const nf = new Intl.NumberFormat("ja-JP");
const fmtLevel = (n) => n.toFixed(2);
const DAY_MS = 86400000;

/**
 * 42 の blackholed_at は「落ちた日」ではなく「期限の日」。
 * 未来の日付はまだ在籍中（その日までに XP を稼ぐ必要がある）という意味で、
 * 過ぎている場合だけブラックホール済み。null は期限なし（common core 修了など）。
 */
const isBlackholed = (member) =>
  member.blackholedAt !== null && Date.parse(member.blackholedAt) <= Date.now();

const daysLeft = (member) =>
  Math.ceil((Date.parse(member.blackholedAt) - Date.now()) / DAY_MS);

let allMembers = [];
let shownMembers = [];
let duplicateRows = 0;
let sortKey = "level";
let sortAsc = false;
let loadAbort = null;

function showMsg(text, isError) {
  els.msg.textContent = text;
  els.msg.classList.toggle("error", !!isError);
  els.msg.hidden = !text;
}

function setBusy(busy) {
  els.spinner.hidden = !busy;
  els.count.classList.toggle("stale", busy && !els.count.classList.contains("empty"));
  els.load.disabled = busy;
  els.load.innerHTML = busy ? '<span class="spinner"></span>読み込み中' : "読み込む";
}

async function load() {
  const month = els.month.value;
  const year = els.year.value;
  showMsg("");
  localStorage.setItem("cohort.month", month);
  localStorage.setItem("cohort.year", year);

  loadAbort?.abort();
  const controller = new AbortController();
  loadAbort = controller;
  setBusy(true);
  els.cohortLabel.textContent = `${year} 年 ${MONTH_JA[month]} ピシン`;

  try {
    const res = await fetch(`/api/cohort?pool_month=${month}&pool_year=${year}`, { signal: controller.signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    allMembers = data.members || [];
    duplicateRows = data.duplicateRows || 0;
    els.pisciners.innerHTML = `${nf.format(data.pisciners ?? 0)}<small>人</small>`;
    render();
    if (allMembers.length === 0) {
      showMsg("この期のデータが 0 件でした。月と年を確認してください（ピシンが無い月もあります）。");
    }
  } catch (err) {
    if (err.name === "AbortError") return;
    allMembers = [];
    els.count.classList.add("empty");
    els.count.innerHTML = '<span class="placeholder">—</span><span class="unit">人</span>';
    els.substats.hidden = true;
    els.chartCard.hidden = true;
    els.listCard.hidden = true;
    showMsg(`取得に失敗しました: ${err.message}`, true);
  } finally {
    if (loadAbort === controller) {
      loadAbort = null;
      setBusy(false);
    }
  }
}

function render() {
  shownMembers = els.includeBh.checked ? allMembers.slice() : allMembers.filter((m) => !isBlackholed(m));
  const levels = shownMembers.map((m) => m.level).sort((a, b) => a - b);
  const blackholed = allMembers.filter(isBlackholed).length;
  const soon = allMembers.filter((m) => !isBlackholed(m) && m.blackholedAt && daysLeft(m) <= 30).length;

  els.count.classList.toggle("empty", shownMembers.length === 0);
  els.count.innerHTML = shownMembers.length
    ? `${nf.format(shownMembers.length)}<span class="unit">人</span>`
    : '<span class="placeholder">—</span><span class="unit">人</span>';
  els.median.textContent = levels.length ? fmtLevel(median(levels)) : "—";
  els.top.textContent = levels.length ? fmtLevel(levels[levels.length - 1]) : "—";
  els.blackholed.innerHTML = `${nf.format(blackholed)}<small>人</small>`;
  els.soon.innerHTML = `${nf.format(soon)}<small>人</small>`;
  els.substats.hidden = false;

  els.chartCard.hidden = shownMembers.length === 0;
  els.listCard.hidden = shownMembers.length === 0;
  if (shownMembers.length === 0) return;

  renderChart(levels);
  renderTable();
}

const median = (sorted) => {
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
};

function niceCeil(value) {
  if (value <= 5) return 5;
  const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
    if (magnitude * m >= value) return magnitude * m;
  }
  return magnitude * 10;
}

function renderChart(sortedLevels) {
  // レベル 1 刻みのヒストグラム。level 7.42 は「7」の段に入る。
  const highest = Math.floor(sortedLevels[sortedLevels.length - 1]);
  const buckets = Array.from({ length: highest + 1 }, (_, level) => ({ level, count: 0 }));
  for (const level of sortedLevels) buckets[Math.floor(level)].count += 1;

  const peak = Math.max(...buckets.map((b) => b.count));
  const max = niceCeil(Math.max(1, peak));
  let peakShown = false;

  els.chartSub.textContent =
    `横軸はレベル（1 刻み）、縦軸は人数。${shownMembers.length} 人ぶん。`;

  els.gridlines.innerHTML = "";
  for (const ratio of [0, 0.5, 1]) {
    const line = document.createElement("div");
    line.className = "gridline";
    line.style.bottom = `${ratio * 100}%`;
    const label = document.createElement("span");
    label.textContent = nf.format(Math.round(max * ratio));
    line.appendChild(label);
    els.gridlines.appendChild(line);
  }

  els.bars.innerHTML = "";
  els.xaxis.innerHTML = "";
  const tickEvery = Math.max(1, Math.ceil(buckets.length / 12));

  buckets.forEach((bucket, index) => {
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.height = `${Math.max((bucket.count / max) * 100, bucket.count ? 1 : 0)}%`;
    bar.appendChild(fill);

    // 直接ラベルは最頻値だけ（全部の棒に数字は置かない）
    if (bucket.count === peak && peak > 0 && !peakShown) {
      const tag = document.createElement("span");
      tag.className = "peak";
      tag.textContent = `${peak} 人`;
      bar.appendChild(tag);
      peakShown = true;
    }

    const show = (event) => {
      els.tooltip.innerHTML =
        `<b>${bucket.count} 人</b><div>レベル ${bucket.level}.00 〜 ${bucket.level}.99</div>`;
      els.tooltip.classList.add("on");
      const rect = els.tooltip.getBoundingClientRect();
      let left = event.clientX + 14;
      if (left + rect.width > window.innerWidth - 8) left = event.clientX - rect.width - 14;
      els.tooltip.style.left = `${Math.max(8, left)}px`;
      els.tooltip.style.top = `${Math.max(8, event.clientY - rect.height - 14)}px`;
    };
    bar.addEventListener("pointerenter", show);
    bar.addEventListener("pointermove", show);
    bar.addEventListener("pointerleave", () => els.tooltip.classList.remove("on"));
    els.bars.appendChild(bar);

    const tick = document.createElement("div");
    tick.className = "xtick";
    tick.textContent = index % tickEvery === 0 ? String(bucket.level) : "";
    els.xaxis.appendChild(tick);
  });
}

function renderTable() {
  const rows = shownMembers.slice().sort((a, b) => {
    const direction = sortAsc ? 1 : -1;
    const x = a[sortKey];
    const y = b[sortKey];
    if (x === y) return a.login.localeCompare(b.login);
    if (x === null) return 1;
    if (y === null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * direction;
  });

  els.listSub.textContent = `${rows.length} 人 / 列ヘッダをクリックで並べ替え。` +
    (duplicateRows > 0
      ? ` 複数の登録を持つ人が ${duplicateRows} 件あったので、現在の登録だけを表示しています。`
      : "");
  els.tbody.innerHTML = "";
  rows.forEach((member, index) => {
    const tr = document.createElement("tr");
    if (isBlackholed(member)) tr.className = "bh";

    const rank = document.createElement("td");
    rank.className = "rank";
    rank.textContent = String(index + 1);

    const login = document.createElement("td");
    login.textContent = member.login;

    const level = document.createElement("td");
    level.className = "num";
    level.textContent = fmtLevel(member.level);

    const begin = document.createElement("td");
    begin.textContent = member.beginAt ? member.beginAt.slice(0, 10) : "—";

    const state = document.createElement("td");
    if (!member.blackholedAt) {
      state.textContent = "期限なし";
      state.className = "muted";
    } else if (isBlackholed(member)) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = `到達 ${member.blackholedAt.slice(0, 10)}`;
      state.appendChild(tag);
    } else {
      const days = daysLeft(member);
      state.textContent = `${member.blackholedAt.slice(0, 10)} ・ あと ${nf.format(days)} 日`;
      if (days <= 30) state.className = "urgent";
    }

    tr.append(rank, login, level, begin, state);
    els.tbody.appendChild(tr);
  });
}

els.load.addEventListener("click", load);
els.includeBh.addEventListener("change", () => { if (allMembers.length) render(); });
for (const th of document.querySelectorAll("th.sortable")) {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = key === "login"; }
    if (shownMembers.length) renderTable();
  });
}

(function init() {
  els.month.value = localStorage.getItem("cohort.month") || "september";
  els.year.value = localStorage.getItem("cohort.year") || "2025";
  load();

  fetch("/api/config")
    .then((res) => (res.ok ? res.json() : null))
    .then((config) => {
      const campus = config?.campusName || "42Tokyo";
      els.subtitle.textContent = `${campus} の同じピシン出身者が 42cursus のどこまで進んでいるかを一覧します。`;
      els.footer.innerHTML =
        `42 API の <code>/v2/campus/:id/users</code> を <code>pool_month</code> / <code>pool_year</code> で絞り、` +
        `その人たちの <code>/v2/cursus/:id/cursus_users</code> からレベルと blackholed_at を読んでいます。<br>` +
        `<code>blackholed_at</code> は「落ちた日」ではなく<strong>期限の日</strong>なので、` +
        `未来の日付はまだ在籍中（その日までに XP が要る）という意味です。<br>` +
        `ピシンを受けたが 42cursus に入らなかった人は「ピシン参加者」にだけ数えられ、一覧には出ません。`;
    })
    .catch(() => {});
})();
</script>
</body>
</html>
